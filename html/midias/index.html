<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mídia</title>
</head>
<body>

<!-- Nesse exemplo, temos uma imagem, um vídeo, um áudio e um iframe. O elemento de vídeo e áudio possuem controles para reprodução, e o iframe exibe o conteúdo da página de contato. -->

    <img src="./docs/html.png" style="display: block;" />

    <video controls style="width: 50%; border-radius: 10px;">
        <source src="./docs/video5157144958053910112.mp4" type="video/mp4">
        Seu navegador não suporta o elemento de vídeo.
    </video>

    <audio id="player">
        <source src="./docs/Slash Solo _ November Rain(MP3_160K).mp3" type="audio/mpeg">
        Seu navegador não suporta o elemento de áudio.
    </audio>

    <button onclick="document.getElementById('player').play()">Play</button>
    <button onclick="document.getElementById('player').pause()">Pause</button>

    <iframe src="./contato"></iframe> <!-- exemplo de como chamar uma página dentro de outra usando iframe -->


</body>
</html>
